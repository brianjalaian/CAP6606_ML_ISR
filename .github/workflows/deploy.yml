name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Jupyter Book
        run: npm install -g jupyter-book

      - name: Build site
        run: jupyter-book build --html

      # Netlify never builds this site -- the deploy below uploads _build/html
      # directly -- so netlify.toml's [[plugins]] and [[redirects]] are never
      # applied. Anything that must reach the live site happens here.
      - name: Post-build fixes (canonical URLs, module redirects)
        run: node netlify/postbuild.js _build/html

      # Cloudflare is the real target. Netlify below is kept only until the
      # custom domain moves, and is allowed to fail: its token has been
      # returning Forbidden, and a dead deploy there must not fail the run.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Netlify (legacy, until DNS moves)
        continue-on-error: true
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_build/html'
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
