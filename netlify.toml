[build]
  publish = "_build/html"

# Rewrites MyST's localhost-stamped sitemap/robots/canonical URLs to the real
# domain after the build. Runs on top of the dashboard build command, so no
# dashboard change is needed. See netlify/plugins/rewrite-localhost/.
[[plugins]]
  package = "./netlify/plugins/rewrite-localhost"

[build.environment]
  NODE_VERSION = "18"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# The YouTube lecture descriptions (36 videos, Modules 1-6) link to
# /modules/<dir>/, but MyST serves every module overview at /index-N because
# all the pages are named index.md and it de-duplicates the slugs. Those links
# are baked into published video descriptions, so redirect rather than reword
# them. Nothing else is served under /modules/ (PDFs are hashed under /build/).
[[redirects]]
  from = "/modules/01_intro_ml/*"
  to = "/index-1"
  status = 301
  force = true

[[redirects]]
  from = "/modules/02_linear_classifiers/*"
  to = "/index-2"
