[build]
  publish = "_build/html"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# =============================================================================
# DENY BY DEFAULT - Only allow specific public paths
# Everything else requires 'promo' role
# =============================================================================

# PUBLIC PAGES - Allow without authentication
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/promo.html"
  to = "/promo.html"
  status = 200

[[redirects]]
  from = "/intro"
  to = "/intro"
  status = 200

[[redirects]]
  from = "/intro/"
  to = "/intro/"
  status = 200

# Allow static assets (CSS, JS, images, fonts)
[[redirects]]
  from = "/build/*"
  to = "/build/:splat"
  status = 200

[[redirects]]
  from = "/_static/*"
  to = "/_static/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.woff2"
  to = "/:splat.woff2"
  status = 200

[[redirects]]
  from = "/*.woff"
  to = "/:splat.woff"
  status = 200

[[redirects]]
  from = "/*.png"
  to = "/:splat.png"
  status = 200

[[redirects]]
  from = "/*.jpg"
  to = "/:splat.jpg"
  status = 200

[[redirects]]
  from = "/*.ico"
  to = "/:splat.ico"
  status = 200

[[redirects]]
  from = "/*.svg"
  to = "/:splat.svg"
  status = 200

# Allow Netlify Identity endpoint
[[redirects]]
  from = "/.netlify/*"
  to = "/.netlify/:splat"
  status = 200

# =============================================================================
# PROTECTED CONTENT - Require 'promo' role for everything else
# =============================================================================

# If user has 'promo' role, allow access to all paths
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true
  conditions = {Role = ["promo"]}

# Fallback: Redirect unauthenticated users to login
[[redirects]]
  from = "/*"
  to = "/login.html"
  status = 302
  force = true

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
