# MyST configuration
# See docs at: https://mystmd.org/guide/frontmatter
version: 1

project:
  title: "Machine Learning for Intelligent Systems & Robotics"
  description: "An interactive guide to machine learning for intelligent systems and robotics."
  authors:
    - name: Dr. Brian Jalaian
  github: https://github.com/brianjalaian/CAP6606_ML_ISR
  exclude:
    - README.md
    - _build/**
    - .venv/**
  toc:
    - file: intro.md
    - title: "Module 1: Ensemble Methods"
      children:
        - file: modules/01_ensemble_methods/index.md
          title: "Overview"
        - file: notebooks/01_ensemble_methods.ipynb
          title: "Theory & Fundamentals"
        - file: notebooks/01b_ensemble_fraud_detection.ipynb
          title: "Applied: Fraud Detection"
    - title: "Module 2: Neural Networks"
      children:
        - file: modules/02_neural_networks/index.md
          title: "Overview"
        - file: notebooks/02_neural_networks.ipynb
          title: "Theory & Fundamentals"
        - file: notebooks/02b_neural_network_digit_recognition.ipynb
          title: "Applied: Digit Recognition"
    - title: "Module 3: Large Language Models"
      children:
        - file: modules/02-LLM/00-toc-llm.md
          title: "Overview"
        - file: modules/02-LLM/01_tokenization.ipynb
          title: "Tokenization"
        - file: modules/02-LLM/02_attention.ipynb
          title: "Attention"
        - file: modules/02-LLM/03_architecture_gpt.ipynb
          title: "GPT Architecture"
        - file: modules/02-LLM/04_pretraining.ipynb
          title: "Pretraining"
        - file: modules/02-LLM/05_finetuning_classification.ipynb
          title: "Finetuning for Classification"
        - file: modules/02-LLM/06_finetuning_instructions.ipynb
          title: "Instruction Finetuning"

site:
  template: book-theme
  options:
    favicon: assets/favicon.png
    logo: assets/headshot.jpg
    logo_url: https://www.brianjalaian.com
