# MyST configuration for CAP 6606 course book
# See docs at: https://mystmd.org/guide/frontmatter
version: 1

project:
  title: "CAP 6606 – Machine Learning for Intelligent Systems & Robotics"
  description: "Graduate course e-book for intelligent systems and robotics at the University of West Florida."
  authors:
    - name: Dr. Brian Jalaian
      affiliation: University of West Florida
  github: https://github.com/brianjalaian/CAP6606_ML_ISR
  exclude:
    - README.md
    - _build/**
    - .venv/**
  toc:
    - file: intro
    - title: Course Modules
      children:
        - file: notebooks/01_random_forests_tabular
    - title: Lectures
      children:
        - file: lectures/lectures

site:
  template: book-theme
  options:
    favicon: assets/favicon.png
    logo: assets/uwf-logo.png

repository:
  url: https://github.com/brianjalaian/CAP6606_ML_ISR
  branch: main

launch_buttons:
  colab_url: "https://colab.research.google.com"
